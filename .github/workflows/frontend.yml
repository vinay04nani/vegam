name: Frontend

on:
  push:
    branches: [main, dev]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vegam-frontend ./frontend
      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:8080 vegam-frontend
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          for path in / /login/ /signup/ /contact/ /careers/ /support/ /press/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$path")
            echo "$path -> $code"; test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/missing-page)" = 404
